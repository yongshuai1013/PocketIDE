name: PocketIDE
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  IDECore:
    path: Packages/IDECore
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PocketIDE:
    type: application
    platform: iOS
    configFiles:
      Debug: toolchain/NativeCompiler.generated.xcconfig
      Release: toolchain/NativeCompiler.generated.xcconfig
    sources:
      - path: App
      - path: Packages/NativeCompilerBridge/Sources/NativeCompilerBridge
      - path: toolchain/ios-arm64/Toolchain
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Packages/NativeCompilerBridge/Sources/NativeCompilerBridge/include/NativeCompilerBridge.h
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) POCKETIDE_EMBEDDED_LLVM=$(POCKETIDE_EMBEDDED_LLVM)
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketide.app
        PRODUCT_NAME: PocketIDE
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket IDE
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: IDECore
schemes:
  PocketIDE:
    build:
      targets:
        PocketIDE: all
    run:
      config: Debug
    archive:
      config: Release
