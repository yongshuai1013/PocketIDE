plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gingervm.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.gingervm.mobile'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    androidResources {
        noCompress += ['gz']
    }
}
