plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gingervm.nativeprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.gingervm.nativeprobe'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '0.6.1'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}
