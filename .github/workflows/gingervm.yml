name: GingerVM build

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build-local.sh'
      - 'probes/**'
      - 'profiles/**'
      - 'src/**'
      - 'native-ptrace-prototype/**'
      - '.github/workflows/gingervm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Host build, Android core check, and ARM guest probes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up stable Rust and Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install ARM probe tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld binutils file

      - name: Run local build and tests
        run: ./build-local.sh

      - name: Run ARM, Thumb, and guest memory probes
        run: ./probes/run-static-arm-probe.sh

      - name: Upload build and probe outputs
        uses: actions/upload-artifact@v4
        with:
          name: gingervm-build-and-arm-thumb-memory-probes
          path: |
            target/release/gingervm
            build/arm-static-probe/armv7-static-probe.elf
            build/arm-static-probe/run.log
            build/arm-static-probe/thumbv1-static-probe.elf
            build/arm-static-probe/thumb-run.log
            build/arm-static-probe/armv7-memory-probe.elf
            build/arm-static-probe/memory-run.log
          if-no-files-found: error

  android-apk:
    name: Build GingerVM v0.6.7 test-signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Mask test signing passphrase in job logs
        run: |
          set -euo pipefail
          TEST_SIGNING_PASS=$(printf '%s' 'YW5kcm9pZA==' | base64 --decode)
          printf '::add-mask::%s\n' "$TEST_SIGNING_PASS"
          printf 'GINGERVM_SIGNING_PASSWORD=%s\n' "$TEST_SIGNING_PASS" >> "$GITHUB_ENV"
          unset TEST_SIGNING_PASS

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and rootless image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl e2fsprogs
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "READELF=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" >> "$GITHUB_ENV"
          echo "AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt" >> "$GITHUB_ENV"

      - name: Download and verify official Google API10 images; extract without mount/root
        run: bash native-ptrace-prototype/tests/prepare_google_api10_ci.sh

      - name: Stage test signing key in runner temp
        run: |
          set -euo pipefail
          test -s native-ptrace-prototype/ci-test-signing/gingervm-test.keystore
          cp native-ptrace-prototype/ci-test-signing/gingervm-test.keystore "$RUNNER_TEMP/gingervm-test.keystore"
          chmod 600 "$RUNNER_TEMP/gingervm-test.keystore"
          echo "GINGERVM_SIGNING_KEYSTORE=$RUNNER_TEMP/gingervm-test.keystore" >> "$GITHUB_ENV"

      - name: Build and verify continuous-trace APK
        env:
          GINGERVM_SIGNING_KEY_ALIAS: gingervm-test
        run: |
          set -euo pipefail
          bash native-ptrace-prototype/build-native.sh
          APK=native-ptrace-prototype/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" > "$RUNNER_TEMP/apksigner-verify.log"
          EXPECTED_CERT_SHA256=398effdd769fa7db5bc6e45622b0d222570ffd0af3d889a8c23d0a82782ccc98
          ACTUAL_CERT_SHA256=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f' | tr -d ':')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          if unzip -Z1 "$APK" | grep -Eiq '(^|/)[^/]+\.(keystore|jks|p12|pem|pk8|key)$'; then
            echo 'Signing material unexpectedly present in APK.' >&2
            exit 1
          fi
          echo 'APK signature matches the approved GingerVM test certificate.'
          sha256sum "$APK" > "$RUNNER_TEMP/gingervm-v0.6.7-apk.sha256"

      - name: Remove runner copy of test signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gingervm-test.keystore"

      - name: Upload signed APK and checksum only
        uses: actions/upload-artifact@v4
        with:
          name: gingervm-continuous-trace-v0.6.7-test-signed-apk
          path: |
            native-ptrace-prototype/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/gingervm-v0.6.7-apk.sha256
          if-no-files-found: error
          retention-days: 14
