name: Temporary Swift iOS actual compile link probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-swift-ios-probe.yml']
permissions:
  contents: read
concurrency:
  group: temporary-swift-ios-probe
  cancel-in-progress: false
jobs:
  probe:
    if: startsWith(github.event.head_commit.message, 'Probe real ASTGen static Swift iOS link ')
    runs-on: macos-15
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PROBE_ATTEMPT: 'astgen-2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fingerprint pinned source and exact toolchain configuration
        id: fingerprint
        run: python3 scripts/temporary-swift-ios-cache.py signature
      - name: Restore compatible intermediate-only state
        id: cache_restore
        timeout-minutes: 5
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/swift-ios-probe-cache/snapshot
          key: ${{ steps.fingerprint.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.fingerprint.outputs.prefix }}-
      - name: Verify and restore preserved source and intermediate mtimes
        env:
          PROBE_CACHE_MATCHED_KEY: ${{ steps.cache_restore.outputs.cache-matched-key }}
        run: |
          echo "PROBE_CACHE_MATCHED_KEY=$PROBE_CACHE_MATCHED_KEY" >> "$GITHUB_ENV"
          python3 scripts/temporary-swift-ios-cache.py restore
      - name: Actual frontend compile and link with bounded resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p probe-logs
          python3 scripts/temporary-swift-ios-monitor.py
      - name: Prepare audited intermediate-only snapshot without SDK or compiler binaries
        id: cache_snapshot
        if: always() && steps.fingerprint.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/temporary-swift-ios-cache.py snapshot
      - name: Save compatible progress even after a bounded build stop
        id: cache_save
        if: always() && steps.cache_snapshot.outputs.safe == 'true'
        timeout-minutes: 5
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/swift-ios-probe-cache/snapshot
          key: ${{ steps.fingerprint.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record cache action result
        if: always()
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache_restore.outcome }}
          CACHE_SAVE_OUTCOME: ${{ steps.cache_save.outcome }}
          CACHE_MATCHED_KEY: ${{ steps.cache_restore.outputs.cache-matched-key }}
        run: |
          mkdir -p probe-logs
          printf 'RESTORE_ACTION_OUTCOME=%s\nSAVE_ACTION_OUTCOME=%s\nMATCHED_KEY=%s\n' "$CACHE_RESTORE_OUTCOME" "$CACHE_SAVE_OUTCOME" "$CACHE_MATCHED_KEY" >> probe-logs/cache-metadata.txt
      - name: Inspect text-only artifact allowlist
        id: audit
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('probe-logs')
          allowed = {'probe.log', 'stage.txt', 'sources.txt', 'link-metadata.txt', 'build-plan.txt', 'configure-metadata.txt', 'resource-metadata.txt', 'target-metadata.txt', 'step-metadata.txt', 'cache-metadata.txt', 'linker-diagnostics.txt'}
          rows = []
          total = 0
          for p in sorted(root.iterdir()):
              assert p.name in allowed and p.is_file() and not p.is_symlink(), str(p)
              data = p.read_bytes()
              total += len(data)
              assert len(data) <= 8 * 1024**2 and total <= 16 * 1024**2, 'artifact too large'
              import os, re
              text = data.decode('utf-8')
              for key in ('GITHUB_WORKSPACE', 'RUNNER_TEMP', 'HOME'):
                  value = os.environ.get(key)
                  if value:
                      text = text.replace(value, '<' + key + '>')
              text = re.sub(r'https://[^/\s]+:[^@\s]+@', 'https://<REDACTED>@', text)
              text = re.sub(r'(?i)(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)', '<REDACTED_TOKEN>', text)
              data = text.encode('utf-8')
              p.write_bytes(data)
              assert b'\0' not in data, str(p)
              data.decode('utf-8')
              rows.append(f'{p.name}\t{len(data)}\t{hashlib.sha256(data).hexdigest()}')
          (root / 'artifact-audit.txt').write_text('\n'.join(rows) + '\nOnly generated text logs/metadata; no binaries, headers, SDKs, archives or symlinks.\n')
          print((root / 'artifact-audit.txt').read_text())
          PY
      - name: Upload audited diagnostic text only
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-swift-ios-cached-compile-link-logs
          path: probe-logs/
          if-no-files-found: error
          retention-days: 7
