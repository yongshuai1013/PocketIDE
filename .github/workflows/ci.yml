name: iOS unsigned CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and host compiler smoke
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify selected Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - name: Test core package
        run: swift test --package-path Packages/IDECore --parallel
      - name: Build native bridge package (without LLVM)
        run: swift build --package-path Packages/NativeCompilerBridge
      - name: Smoke test native bridge stub (not an embedded compiler test)
        run: bash Packages/NativeCompilerBridge/scripts/host-smoke.sh
      - name: Smoke test macOS host compilers (not iOS native compilation)
        run: bash scripts/host-smoke.sh

  unsigned-ios:
    name: Unsigned iOS 15 arm64 and simulator build
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify selected Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Build pinned XcodeGen
        run: bash scripts/bootstrap-xcodegen.sh
      - name: Generate Xcode project
        run: '"$RUNNER_TEMP/xcodegen-bin/xcodegen" generate --spec project.yml'
      - name: Build for simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project PocketIDE.xcodeproj -scheme PocketIDE \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 build | tee build/simulator.log
      - name: Build unsigned arm64 app
        run: |
          set -o pipefail
          xcodebuild -project PocketIDE.xcodeproj -scheme PocketIDE \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 build | tee build/device.log
      - name: Verify deployment target and unsigned artifact
        run: bash scripts/verify-app.sh build/Device/Build/Products/Release-iphoneos/PocketIDE.app
      - name: Package unsigned app (not installable IPA)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Device/Build/Products/Release-iphoneos/PocketIDE.app \
            build/PocketIDE-unsigned-app.zip
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PocketIDE-unsigned-ios15-arm64
          path: build/PocketIDE-unsigned-app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-build-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
